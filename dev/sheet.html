<!doctype html><html><body style="background:#333;margin:0"><canvas id="c"></canvas><script type="module">
import { CHARACTERS } from '/src/data/characters.ts';
import { charFrame, enemyFrame, mycoraFrame, ignisFrame, lookFrame, ENEMY_LOOKS, propSprite } from '/src/gfx/sprites.ts';
const poses=['idle0','run1','run3','jump','fall','dash','hurt','windHigh','slashDown','windLow','slashUp','thrust','spin','slamWind','slam','cast','castUp','shoot','kick','guard','throw'];
const c=document.getElementById('c'); const S=3; c.width=48*poses.length*S; c.height=48*(CHARACTERS.length+6)*S;
const g=c.getContext('2d'); g.imageSmoothingEnabled=false;
CHARACTERS.forEach((ch,j)=>poses.forEach((p,i)=>g.drawImage(charFrame(ch.id,p),i*48*S,j*48*S,48*S,48*S)));
const en=['skeleton','bone_archer','wraith','bone_shield','slime','venom_bug','spore_cap','moth','fire_sprite','magma_golem','forge_hound','smith_skel','royal_guard','shade','shadow_mage','royal_lancer','dummy'];
const an=['idle','move','wind','atk','hurt'];
en.forEach((e,i)=>an.forEach((a,k)=>g.drawImage(enemyFrame(e,a,1),(i%4*5+k)*48*S,(CHARACTERS.length+Math.floor(i/4))*48*S,48*S,48*S)));
const y=(CHARACTERS.length+5)*48*S;
g.drawImage(mycoraFrame('idle',0),0,y-48*S,96*S/1.5,96*S/1.5);
g.drawImage(ignisFrame('idle',0,false),200,y-48*S,112*S/1.5,112*S/1.5);
g.drawImage(lookFrame('b:graven',ENEMY_LOOKS.graven,'windHigh'),400,y-48*S,96*S,96*S);
g.drawImage(lookFrame('b:king',ENEMY_LOOKS.king,'slashDown'),700,y-48*S,96*S,96*S);
['door_closed','chest','altar','anvil','shopkeeper','campfire','question','portal','stele','book','banner','crystal'].forEach((k,i)=>g.drawImage(propSprite(k),1000+i*120,y-40*S,propSprite(k).width*2,propSprite(k).height*2));
document.title='done';
</script></body></html>
